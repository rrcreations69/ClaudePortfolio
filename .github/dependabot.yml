# Dependabot — required by CLAUDE.md's security posture alongside npm audit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group the noisy ones so a week's updates arrive as a few reviewable PRs
    # rather than a dozen that get rubber-stamped.
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
